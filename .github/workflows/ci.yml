name: CI

# Auto CI disabled (private repo quota). Run manually via Actions → workflow_dispatch.
on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast compile check - catches errors before expensive matrix
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            clang libclang-dev llvm-dev \
            libasound2-dev pkg-config build-essential \
            libfreetype6-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace --all-targets

  # Matrix test across platforms
  test:
    name: Test (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ""
          - os: windows-latest
            features: "--no-default-features --features mock_video"
          - os: macos-latest
            features: "--no-default-features --features mock_video"
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            clang libclang-dev llvm-dev \
            libasound2-dev pkg-config build-essential \
            libfreetype6-dev libfontconfig1-dev

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Verify decoder tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Download test assets
        run: |
          mkdir -p crates/director-core/assets/fonts
          FONT_DIR=crates/director-core/assets/fonts
          curl -sL -o "$FONT_DIR/Roboto-Regular.ttf" "https://cdn.jsdelivr.net/gh/googlefonts/roboto@v2.138/src/hinted/Roboto-Regular.ttf"
          curl -sL -o "$FONT_DIR/Roboto-Bold.ttf" "https://cdn.jsdelivr.net/gh/googlefonts/roboto@v2.138/src/hinted/Roboto-Bold.ttf"
          curl -sL -o "$FONT_DIR/Roboto-Italic.ttf" "https://cdn.jsdelivr.net/gh/googlefonts/roboto@v2.138/src/hinted/Roboto-Italic.ttf"
          curl -sL -o "$FONT_DIR/Inter-Regular.ttf" "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf"
          cp -f "$FONT_DIR/Inter-Regular.ttf" "$FONT_DIR/Inter-Bold.ttf"
          curl -sL -o "$FONT_DIR/Poppins-Bold.ttf" "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/poppins/Poppins-Bold.ttf"
          # Sanity: real TTFs, not HTML error pages
          file "$FONT_DIR"/*.ttf | grep -qiE 'TrueType|OpenType|sfnt' || (echo "Font download produced non-font files"; file "$FONT_DIR"/*; exit 1)

      - name: Run tests
        run: cargo test --workspace ${{ matrix.features }}

  # Clippy linting
  clippy:
    name: Clippy
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libavfilter-dev libavdevice-dev \
            clang libclang-dev llvm-dev \
            libasound2-dev pkg-config build-essential \
            libfreetype6-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
