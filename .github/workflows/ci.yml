name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (check, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ffmpeg clang libclang-dev llvm-dev \
            libasound2-dev pkg-config build-essential \
            libfreetype6-dev libfontconfig1-dev

      - name: Verify decoder tools
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings

      - name: Test
        run: cargo test --workspace --release

      - name: Upload visual failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-failures
          path: target/tmp/**/*.png
          if-no-files-found: ignore
