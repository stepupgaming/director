[package]
name = "director-3d"
version.workspace = true
edition.workspace = true
autotests = false
license.workspace = true
description = "Real 3D for Director: glTF scenes rendered by Bevy on Vulkan"

[dependencies]
director-core.workspace = true
director-scene.workspace = true
skia-safe = { workspace = true }
anyhow.workspace = true
serde_json.workspace = true
taffy = "0.9.2"
bevy = { version = "=0.20.1", default-features = false, features = ["default_app", "std", "3d_bevy_render", "exr", "hdr", "bevy_world_serialization", "raw_vulkan_init", "bevy_solari"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["vulkan"] }
half = "2"
# Triangulates the faces of extruded type.
lyon_tessellation = "1.0.23"
# Gaussian splats: PLY and gcloud files, spherical harmonics to degree 3, and the GPU radix sort,
# which orders every view each frame so a frame depends only on its camera.
bevy_gaussian_splatting = { version = "=9.0.0", default-features = false, features = ["io_flexbuffers", "io_ply", "planar", "buffer_storage", "sh3", "sort_radix"] }
# Same features as director-cli, so both build one copy of ash and wgpu-hal.
ash = { version = "0.38", features = ["loaded"] }


# tests/main.rs declares every tests/*.rs as a module: one test binary.
[[test]]
name = "integration"
path = "tests/main.rs"
