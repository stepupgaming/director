[package]
name = "director-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
autotests = false
description = "Host session over a Director scene document: open, patch, inspect, render and export."

[dependencies]
director-core = { workspace = true }
director-scene = { workspace = true }
director-render = { workspace = true }
director-html = { workspace = true }
base64 = "0.22"
memmap2 = "0.9"
rhai = "1.23.6"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1.43"

[dev-dependencies]
tempfile = "3.23"

[features]
default = ["vulkan"]
vulkan = ["director-render/vulkan"]

# tests/main.rs declares every tests/*.rs as a module: one test binary.
[[test]]
name = "integration"
path = "tests/main.rs"
