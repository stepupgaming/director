[package]
name = "director-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
autotests = false
description = "Paints and exports frames of a live Director or a scene document."

[dependencies]
director-core = { workspace = true }
director-scene = { workspace = true }
skia-safe = { workspace = true }
thiserror = { workspace = true }
rayon = "1.10"
keyframe = "1.1.1"
anyhow = { workspace = true }

[dev-dependencies]
taffy = "0.9.2"
director-html = { path = "../director-html" }
base64 = "0.22"
tempfile = "3.23"
rhai = { version = "1.23.6", features = ["metadata"] }
serde_json = { workspace = true }

[features]
default = ["vulkan"]
vulkan = []

# tests/main.rs declares every tests/*.rs as a module: one test binary.
[[test]]
name = "integration"
path = "tests/main.rs"
