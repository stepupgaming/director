[package]
name = "director-cli"
version = "0.1.0"
edition = "2021"
description = "CLI for the Director rendering engine"
license = "MIT"

[dependencies]
anyhow.workspace = true
clap = { version = "4.5.53", features = ["derive"] }
director-core = { path = "../director-core" }
director-html = { path = "../director-html" }
director-render = { path = "../director-render" }
director-schema = { path = "../director-schema" }
serde = { version = "1.0", features = ["derive"] }
rhai = "1.23.6"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
image = "0.25.9"
lottie-core = { path = "../lottie-core" }
lottie-data = { path = "../lottie-data" }
lottie-skia = { path = "../lottie-skia" }
serde_json = "1.0"
skia-safe = "0.153.3"
ash = { version = "0.38", features = ["loaded"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.23"
tower = { version = "0.5", features = ["util"] }

[features]
default = ["video"]
video = []
vulkan = ["director-core/vulkan", "director-render/vulkan", "dep:ash"]
[[bin]]
name = "director-engine"
path = "src/main.rs"

[[bin]]
name = "director-manifest"
path = "src/bin/director_manifest.rs"

[[bin]]
name = "director-cli"
path = "src/bin/director_cli.rs"
