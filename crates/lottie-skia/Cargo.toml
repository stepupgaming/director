[package]
name = "lottie-skia"
version.workspace = true
edition.workspace = true
autotests = false
license = "MIT"
description = "Skia renderer for Lottie animations"

[dependencies]
lottie-core.workspace = true
skia-safe.workspace = true
glam.workspace = true
kurbo.workspace = true

[dev-dependencies]
lottie-data = { path = "../lottie-data" }
serde_json = "1.0"

# tests/main.rs declares every tests/*.rs as a module: one test binary.
[[test]]
name = "integration"
path = "tests/main.rs"
