[package]
name = "director-core"
version = "1.1.1"
edition = "2021"
description = "A high-performance 2D rendering engine using Skia and Taffy"
license = "MIT"
repository = "https://github.com/babybirdprd/rust-skia-engine"
keywords = ["graphics", "skia", "rendering", "video"]
categories = ["rendering", "multimedia::video"]

[dependencies]
skia-safe = { version = "0.90.0", features = ["textlayout"] }
taffy = "0.9.2"
keyframe = "1.1.1"
rhai = { version = "1.23.6", features = ["metadata"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
image = "0.25.9"
symphonia = { version = "0.5.3", features = ["aac", "mp3", "pcm", "wav", "isomp4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { workspace = true }
rubato = "0.14"
realfft = "3.4"

# Lottie Dependencies
lottie-core = { path = "../lottie-core", version = "0.1.0" }
lottie-data = { path = "../lottie-data", version = "0.1.0" }
lottie-skia = { path = "../lottie-skia", version = "0.1.0" }

# Optional dependencies
wgpu = { version = "23", optional = true }
bytemuck = { version = "1", optional = true, features = ["derive"] }
pollster = { version = "0.4", optional = true }

ndarray = "0.16"
rayon = "1.10"
tempfile = "3.23.0"
crossbeam-channel = "0.5.15"
unicode-segmentation = "1.10"
rand = "0.8"
resvg = "0.44"
usvg = "0.44"
tiny-skia = "0.11"
tracing = "0.1.43"

[dev-dependencies]
hound = "3.5"
tracing-subscriber = "0.3.22"

[features]
default = []
mock_video = []
vulkan = ["skia-safe/vulkan"]
wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]

[package.metadata.docs.rs]
no-default-features = true
features = []

