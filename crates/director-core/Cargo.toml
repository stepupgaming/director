[package]
name = "director-video-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
autotests = false
description = "A high-performance 2D rendering engine using Skia and Taffy"
exclude = ["tests/", "benches/"]
keywords = ["graphics", "skia", "rendering", "video"]
categories = ["rendering", "multimedia::video"]

[lib]
name = "director_core"

[dependencies]
skia-safe = { workspace = true }
taffy = "0.9.2"
keyframe = "1.1.1"
rhai = { version = "1.23.6", features = ["metadata"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
image = "0.25.9"
symphonia = { version = "0.5.3", features = ["aac", "mp3", "pcm", "wav", "isomp4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
schemars = { workspace = true }
rubato = "0.14"
realfft = "3.4"
ebur128 = "0.1"

# Lottie Dependencies
lottie-core = { workspace = true }
lottie-data = { workspace = true }
lottie-skia = { workspace = true }

rayon = "1.10"
tempfile = "3.23.0"
crossbeam-channel = "0.5.15"
unicode-segmentation = "1.10"
rand = "0.8"
resvg = "0.44"
uuid = { version = "1.10", features = ["v4", "serde"] }
usvg = "0.44"
tiny-skia = "0.11"
director-scene = { workspace = true }
tracing = "0.1.43"

[dev-dependencies]
director-render = { path = "../director-render" }
hound = "3.5"
tracing-subscriber = "0.3.22"
criterion = "0.5"

[[bench]]
name = "layout_snapshot_bench"
harness = false

[package.metadata.docs.rs]
no-default-features = true
features = []


# tests/main.rs declares every tests/*.rs as a module: one test binary.
[[test]]
name = "integration"
path = "tests/main.rs"
