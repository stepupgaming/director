<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Bold.ttf"); font-weight:700; }
  html, body { margin:0; background:#000; }
  * { box-sizing:border-box; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:#0b0b0f; font-family:Roboto; font-weight:700; color:#fff; }
  #ring { position:absolute; left:660px; top:240px; width:600px; height:600px; border-radius:300px; border:18px solid #ff3d6e; }
  .word { position:absolute; left:0; top:390px; width:1920px; margin:0; text-align:center; font-size:300px; line-height:1; letter-spacing:-8px; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; }
  #logo { position:absolute; inset:0; background:#ff3d6e; display:flex; align-items:center; justify-content:center; font-size:180px; color:#0b0b0f; }
</style></head><body>
<!-- 128 BPM from 0.25 s: one bar is 1.875 s and the film ends after four bars. -->
<div id="stage" data-composition-id="kinetic-beats" data-width="1920" data-height="1080" data-fps="30"
     data-bpm="128" data-beat-offset="0.25" data-duration="4bar">
  <div id="ring"></div>
  <h1 class="word" id="w1" data-start="0b" data-duration="1bar">ON</h1>
  <h1 class="word" id="w2" data-start="1bar" data-duration="1bar">THE</h1>
  <h1 class="word" id="w3" data-start="2bar" data-duration="1bar">BEAT</h1>
  <div id="flash"></div>
  <div id="logo" data-start="3bar" data-sfx="../assets/tone.wav" data-sfx-volume="0.4">director</div>
</div>
<script type="application/director-timeline+json">
{
  "format": "director-timeline/1",
  "tracks": [
    { "target": "flash", "property": "opacity", "keyframes": [
      { "time": "3bar - 1b", "value": 0 },
      { "time": "3bar - 0.25b", "value": 0.8, "ease": "power2.in" },
      { "time": "3bar", "value": 0 } ] }
  ]
}
</script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  // The ring kicks on every beat and the words punch in on each bar.
  for (let beat = 0; beat < 3 * director.beatsPerBar; beat++) {
    tl.fromTo("#ring", { scale: beat % director.beatsPerBar ? 1.08 : 1.18 },
      { scale: 1, duration: director.beat(beat + 1) - director.beat(beat), ease: "expo.out" }, director.beat(beat));
  }
  ["#w1", "#w2", "#w3"].forEach((word, bar) => {
    tl.fromTo(word, { scale: 1.4 }, { scale: 1, duration: 0.5, ease: "expo.out" }, director.bar(bar));
  });
  window.__timelines["kinetic-beats"] = tl;
</script>
</body></html>
