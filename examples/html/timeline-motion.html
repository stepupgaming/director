<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Regular.ttf"); font-weight:400; }
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Bold.ttf"); font-weight:700; }
  html, body { margin:0; background:#0e1320; }
  * { box-sizing:border-box; }
  #stage { position:relative; width:100%; height:100%; background:linear-gradient(135deg,#0e1320 0%,#1d2f4a 100%); font-family:Roboto; color:#fff; }
  #title { position:absolute; left:140px; top:300px; margin:0; font-size:112px; font-weight:700; }
  #subtitle { position:absolute; left:144px; top:450px; margin:0; font-size:40px; color:#b8cce6; }
  #bar { position:absolute; left:144px; top:540px; width:0px; height:10px; border-radius:5px; background:#5ab0ff; }
  #card { position:absolute; left:1300px; top:620px; width:420px; height:240px; border-radius:28px; background:#2a3f5f; display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:700; }
</style></head><body>
<div id="stage" data-composition-id="timeline-motion" data-no-timeline data-width="1920" data-height="1080" data-fps="30" data-duration="4">
  <h1 id="title">Motion as data.</h1>
  <p id="subtitle">Keyframe tracks in JSON, compiled to native animation.</p>
  <div id="bar"></div>
  <div id="card">director-timeline/1</div>
</div>
<script type="application/director-timeline+json">
{
  "format": "director-timeline/1",
  "tracks": [
    { "target": "title", "property": "transform", "keyframes": [
      { "time": 0.0, "value": "translateX(-160px)" },
      { "time": 0.9, "value": "translateX(0px)", "ease": "cubic-bezier(0.16, 1, 0.3, 1)" } ] },
    { "target": "title", "property": "opacity", "keyframes": [
      { "time": 0.0, "value": 0 },
      { "time": 0.6, "value": 1, "ease": "ease-out" } ] },
    { "target": "subtitle", "property": "opacity", "keyframes": [
      { "time": 0.5, "value": 0 },
      { "time": 1.2, "value": 1, "ease": "ease-in-out" } ] },
    { "target": "bar", "property": "width", "keyframes": [
      { "time": 0.8, "value": 0 },
      { "time": 1.8, "value": 920, "ease": "cubic-bezier(0.65, 0, 0.35, 1)" } ] },
    { "target": "card", "property": "transform", "keyframes": [
      { "time": 1.4, "value": "translateY(120px) rotate(-6deg)" },
      { "time": 2.2, "value": "translateY(0px) rotate(0deg)", "ease": "cubic-bezier(0.34, 1.56, 0.64, 1)" },
      { "time": 3.6, "value": "translateY(-12px) rotate(2deg)", "ease": "ease-in-out" } ] },
    { "target": "card", "property": "opacity", "keyframes": [
      { "time": 1.4, "value": 0 },
      { "time": 1.8, "value": 1 } ] },
    { "target": "card", "property": "background-color", "keyframes": [
      { "time": 2.2, "value": "#2a3f5f" },
      { "time": 3.6, "value": "#3c6db0", "ease": "ease-in-out" } ] }
  ]
}
</script>
</body></html>
