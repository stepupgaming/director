  #s04 .caption { color:#fff; }
</style></head><body>
<div id="s04" class="film" data-composition-id="s04" data-width="1920" data-height="1080" data-fps="60"

      <circle id="s04-ohalo" cx="0" cy="0" r="14" fill="#ff5a36" filter="url(#s04-gl)"/>

      <svg id="s04-back" viewBox="0 0 1920 1080">

        </defs>
        <path id="s04-fill" d="M310 724 L310 396 L326 380 L1594 380 L1610 396 L1610 724 L1594 740 L326 740 Z" fill="#101113" fill-opacity="0.82" opacity="0"/>
        <path id="s04-outline" d="M310 724 L310 396 L326 380 L1594 380 L1610 396 L1610 724 L1594 740 L326 740 Z" fill="none" stroke="#dcd7d3" stroke-width="2.2"/>
        <path id="s04-glow" d="M0 0" fill="none" stroke="#ff4b2b" stroke-width="10" stroke-linecap="round" filter="url(#s04-blur)" opacity="0.8"/>
        <path id="s04-tail2" d="M0 0" fill="none" stroke="#ff5a36" stroke-width="4" stroke-linecap="round"/>
        <path id="s04-tail1" d="M0 0" fill="none" stroke="#ffe2d8" stroke-width="2.5" stroke-linecap="round"/>

  <div id="s04-chipc"></div>
  <p class="caption" id="s04-cap"><span class="w" id="s04-w0">It</span> <span class="w" id="s04-w1">got</span> <span class="w" id="s04-w2">one</span> <span class="w" id="s04-w3">brief.</span></p>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
  <p class="hud" style="left:62px;top:50px">FRAME <span id="s04-frame">0684</span></p>
  <p class="hud" style="right:62px;top:50px">DIRECTOR &#183; FILM.HTML</p>
  <p class="hud" style="left:62px;bottom:48px"><span class="rec" id="s04-rec">&#9679;</span> REC</p>
  <p class="hud" id="s04-tc" style="right:62px;bottom:48px">00:00:11:24</p>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(() => {
  window.__timelines = window.__timelines || {};
  const FILM_START = 684 / 60, DURATION = 394 / 60;
  const T = (film) => film - FILM_START;            // film seconds -> shot seconds
  const $ = (id) => document.getElementById(id);
  const tl = gsap.timeline({ paused: true });
  const pad = (n, w = 2) => String(n).padStart(w, "0");

  // HUD: frame counter, timecode, REC blink.
  const rec = $("s04-rec");
  tl.to({}, { duration: DURATION, ease: "none", onUpdate() {
    const f = Math.round((FILM_START + tl.time()) * 60);
    $("s04-frame").textContent = pad(f, 4);
    $("s04-tc").textContent = "00:00:" + pad(Math.floor(f / 60)) + ":" + pad(f % 60);
  } }, 0);
  tl.set(rec, { opacity: Math.floor(FILM_START * 2) % 2 === 0 ? 1 : 0.25 }, 0);
  for (let k = Math.ceil(FILM_START * 2); k / 2 < FILM_START + DURATION; k++) {
    tl.set(rec, { opacity: k % 2 === 0 ? 1 : 0.25 }, T(k / 2));
  }

  // Caption: words arrive one at a time, the red chip slides to the newest word.
  const chipc = $("s04-chipc");
  const wordTimes = [11.467, 11.53, 11.93, 12.18];
  wordTimes.forEach((ft, i) => {
    const w = $("s04-w" + i), t = T(ft);
    const left = 132 + w.offsetLeft - 5, width = w.offsetWidth + 10;
    tl.fromTo(w, { opacity: 0, y: 9, color: "#8a8786" }, { opacity: 1, y: 0, duration: 0.08, ease: "power2.out" }, Math.max(0, t - 0.06));
    tl.to(w, { color: "#ffffff", duration: 0.05, ease: "none" }, t + 0.02);
    if (i === 0) tl.fromTo(chipc, { left: left, width: 0 }, { width: width, duration: 0.07, ease: "power2.out" }, t);
    else tl.to(chipc, { left: left, width: width, duration: 0.09, ease: "power3.inOut" }, t + 0.02);
  });
  tl.to(["#s04-cap", chipc], { opacity: 0, duration: 0.3, ease: "none" }, T(16.9));

  // Panel outline draws itself behind a glowing red comet.
  const LEAD = 196, LOOP = 4 * 16 * Math.SQRT2 + 2 * 1268 + 2 * 328;
  const cometD = "M310 920 L310 724 L310 396 L326 380 L1594 380 L1610 396 L1610 724 L1594 740 L326 740 L310 724 L310 396 L326 380";
  ["s04-glow", "s04-tail1", "s04-tail2"].forEach((id) => $(id).setAttribute("d", cometD));
  const cpath = $("s04-tail1");
  const ctotal = cpath.getTotalLength();
  const outline = $("s04-outline");
  const seg = (el, a, b, total) => {
    a = Math.max(0, a); b = Math.max(a + 0.01, b);
    el.setAttribute("stroke-dasharray", (b - a).toFixed(1) + " " + (total + 10).toFixed(0));
    el.setAttribute("stroke-dashoffset", (-a).toFixed(1));
  };
  const cm = { L: 0 };
  const drawCm = () => {
    const L = cm.L;
    seg($("s04-tail1"), L - 260, L, ctotal);
    seg($("s04-tail2"), L - 480, L - 20, ctotal);
    seg($("s04-glow"), L - 420, L, ctotal);
    seg(outline, 0, Math.min(LOOP + 1, Math.max(0, L - LEAD - 30)), LOOP);
    const p = cpath.getPointAtLength(Math.min(L, ctotal));
    ["s04-head", "s04-halo"].forEach((id) => { $(id).setAttribute("cx", p.x.toFixed(1)); $(id).setAttribute("cy", p.y.toFixed(1)); });
  };
  drawCm();
  const ckeys = [[11.40, 0], [11.44, LEAD], [11.47, 524], [11.60, 1815], [11.65, 2166], [11.73, 3456], [11.79, 3807], [11.81, 3830]];
  for (let k = 1; k < ckeys.length; k++) {
    tl.to(cm, { L: ckeys[k][1], duration: ckeys[k][0] - ckeys[k - 1][0], ease: "none", onUpdate: drawCm }, T(ckeys[k - 1][0]));
  }
  tl.to(["#s04-glow", "#s04-tail1", "#s04-tail2", "#s04-head", "#s04-halo"], { opacity: 0, duration: 0.08, ease: "none" }, T(11.82));
  tl.to("#s04-back", { opacity: 1, duration: 0.2, ease: "none" }, T(11.62));
  tl.to("#s04-fill", { opacity: 1, duration: 0.3, ease: "none" }, T(11.7));
  gsap.set(["#s04-dot", "#s04-label", "#s04-count", "#s04-key", "#s04-keyart"], { opacity: 0 });
  tl.to(["#s04-dot", "#s04-label"], { opacity: 1, duration: 0.1, ease: "none" }, T(11.72));
  tl.to("#s04-count", { opacity: 1, duration: 0.1, ease: "none" }, T(11.66));
  tl.to(["#s04-key", "#s04-keyart"], { opacity: 1, duration: 0.1, ease: "none" }, T(15.88));
  gsap.set("#s04-back", { z: -16 });
  // Once drawn, the outline hands over to CSS bars that stay crisp under the push-in.
  const EDGES = [[326, 380, 1594, 380], [1594, 380, 1610, 396], [1610, 396, 1610, 724], [1610, 724, 1594, 740],
                 [1594, 740, 326, 740], [326, 740, 310, 724], [310, 724, 310, 396], [310, 396, 326, 380]];
  EDGES.forEach(([x1, y1, x2, y2]) => {
    const e = document.createElement("div");
    e.className = "s04-edge";
    const len = Math.hypot(x2 - x1, y2 - y1) + 1.6, a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    e.style.left = ((x1 + x2) / 2 - len / 2).toFixed(2) + "px";
    e.style.top = ((y1 + y2) / 2 - 1.1).toFixed(2) + "px";
    e.style.width = len.toFixed(2) + "px";
    e.style.transform = "rotate(" + a.toFixed(1) + "deg)";
    $("s04-edges").appendChild(e);
  });
  tl.set("#s04-edges", { opacity: 1 }, T(11.86));
  tl.set(outline, { opacity: 0 }, T(11.86));

  // Panel attitude: a slight 3D turn that settles.
  gsap.set("#s04-panel", { rotationY: -8, rotation: -1.6 });
  tl.to("#s04-panel", { rotationY: -2.5, rotation: 0.5, duration: T(13.2) - T(11.4), ease: "sine.inOut" }, 0);

  // Brief text: typed segment by segment, key phrases land on red chips.
  const X0 = 352, ADV = 19.6, TOPS = [465, 518, 571];
  const LINES = [
    [["A 52-second film: heavy ", -1], ["kinetic type", 0], [", one ", -1], ["glowing line", 1]],
    [["through every scene, ", -1], ["3D letters", 2], [" the ", -1], ["camera flies through", 3], [", and", -1]],
    [["a ", -1], ["hard cut", 4], [" on every beat.", -1]],
  ];
  const CHIP_TIMES = [12.85, 13.20, 13.95, 14.50, 14.95];
  const textBox = $("s04-text");
  const segs = [];
  let base = 0;
  LINES.forEach((line, li) => {
    let col = 0;
    line.forEach(([txt, chip]) => {
      if (chip >= 0) {
        const c = document.createElement("div");
        c.className = "s04-chip";
        c.style.left = (X0 + col * ADV - 1).toFixed(1) + "px";
        c.style.top = (TOPS[li] + 1) + "px";
        c.style.width = (txt.length * ADV + 2).toFixed(1) + "px";
        textBox.appendChild(c);
        gsap.set(c, { scaleX: 0 });
        tl.to(c, { scaleX: 1, duration: 0.09, ease: "power2.out" }, T(CHIP_TIMES[chip]));
      }
      const s = document.createElement("p");
      s.className = "s04-seg";
      s.style.left = (X0 + col * ADV).toFixed(1) + "px";
      s.style.top = TOPS[li] + "px";
      s.textContent = " ";
      textBox.appendChild(s);
      if (chip >= 0) tl.to(s, { color: "#1a0c0a", duration: 0.06, ease: "none" }, T(CHIP_TIMES[chip]) + 0.03);
      segs.push({ el: s, txt: txt.replace(/ /g, " "), start: base + col });
      col += txt.length;
    });
    base += col + 1;   // the line break counts as a character
  });
  const cur = $("s04-cur"), count = $("s04-count");
  const ty = { n: 0 };
  const drawType = () => {
    const n = Math.round(ty.n);
    segs.forEach((g) => {
      const k = Math.max(0, Math.min(g.txt.length, n - g.start));
      g.el.textContent = k > 0 ? g.txt.slice(0, k) : " ";
    });
    let li = 0, col = n;
    if (n > 116) { li = 2; col = n - 117; } else if (n > 54) { li = 1; col = n - 55; }
    cur.style.left = (X0 + col * ADV + 1).toFixed(1) + "px";
    cur.style.top = (TOPS[li] + 8) + "px";
    count.textContent = pad(n, 3) + " / 2000 CHARS";
  };
  drawType();
  gsap.set(cur, { opacity: 0 });
  tl.set(cur, { opacity: 1 }, T(11.84));
  const tkeys = [[11.80, 0], [11.85, 1], [12.25, 17], [12.75, 37], [13.10, 54], [13.15, 55], [13.60, 75], [14.00, 90],
                 [14.60, 116], [14.64, 117], [15.15, 142]];
  for (let k = 1; k < tkeys.length; k++) {
    tl.to(ty, { n: tkeys[k][1], duration: tkeys[k][0] - tkeys[k - 1][0], ease: "none", onUpdate: drawType }, T(tkeys[k - 1][0]));
  }
  for (let t = 15.6; t < 16.5; t += 0.5) {
    tl.set(cur, { opacity: 0 }, T(t));
    tl.set(cur, { opacity: 1 }, T(t + 0.25));
  }

  // The red loop that circles the chips in the wide shot.
  const loop = $("s04-loop");
  const loopProxy = { cx: 940, cy: 492, a: 0 };
  const drawLoop = () => {
    loop.setAttribute("cx", loopProxy.cx.toFixed(1));
    loop.setAttribute("cy", loopProxy.cy.toFixed(1));
    loop.setAttribute("transform", "rotate(" + (-4).toFixed(1) + " " + loopProxy.cx.toFixed(1) + " " + loopProxy.cy.toFixed(1) + ")");
    const per = 2 * Math.PI * Math.sqrt((250 * 250 + 112 * 112) / 2);
    loop.setAttribute("stroke-dasharray", (per * loopProxy.a).toFixed(1) + " " + (per + 10).toFixed(0));
  };
  drawLoop();
  tl.set(loop, { attr: { opacity: 0.85 } }, T(15.66));
  tl.to(loopProxy, { a: 1, duration: 0.2, ease: "power2.out", onUpdate: drawLoop }, T(15.66));
  tl.to(loopProxy, { cx: 1290, cy: 495, duration: 0.25, ease: "power2.inOut", onUpdate: drawLoop }, T(15.88));
  tl.to(loop, { attr: { opacity: 0 }, duration: 0.15, ease: "none" }, T(16.3));

  // Enter key lights up.
  tl.to("#s04-key", { backgroundColor: "#ef4a2c", borderColor: "#ef4a2c", boxShadow: "0 0 18px rgba(239,74,44,.7)", duration: 0.04, ease: "none" }, T(16.93));
  tl.to(".s04-kb", { backgroundColor: "#2a0f0a", duration: 0.04, ease: "none" }, T(16.93));

  // "Aa" specimen: the variable axes cycle bold, wide black, thin.
  gsap.set("#s04-aa", { opacity: 0 });
  tl.to("#s04-aa", { opacity: 1, duration: 0.2, ease: "none" }, T(12.9));
  tl.to("#s04-aa", { fontVariationSettings: '"wdth" 125, "wght" 900', duration: 0.5, ease: "power2.inOut" }, T(14.8));
  tl.to("#s04-aa", { fontVariationSettings: '"wdth" 100, "wght" 200', duration: 0.45, ease: "power2.inOut" }, T(15.6));

  // Diamond splits into two triangles and rejoins; nested squares and the orbit fade in.
  gsap.set(["#s04-triu", "#s04-trid", "#s04-nest", "#s04-orbit"], { opacity: 0 });
  tl.to("#s04-orbit", { opacity: 1, duration: 0.25, ease: "none" }, T(13.9));
  tl.to(["#s04-triu", "#s04-trid", "#s04-nest"], { opacity: 1, duration: 0.25, ease: "none" }, T(14.7));
  tl.to("#s04-trid", { x: 32, y: 35, duration: 0.15, ease: "power3.out" }, T(15.8));
  tl.to("#s04-triu", { y: -2, duration: 0.15, ease: "power3.out" }, T(15.8));
  tl.to("#s04-trid", { x: 0, y: 0, duration: 0.15, ease: "power3.inOut" }, T(16.45));
  tl.to("#s04-triu", { y: 0, duration: 0.15, ease: "power3.inOut" }, T(16.45));

  // Orbiting comet on the dotted ellipse.
  const A0 = -2.83, orb = { a: A0 };
  const OX = 1735, OY = 298, RX = 125, RY = 52;
  const arc = (a0, a1) => {
    let d = "";
    for (let i = 0; i <= 14; i++) {
      const a = a0 + (a1 - a0) * i / 14;
      d += (i ? " L" : "M") + (OX + RX * Math.cos(a)).toFixed(1) + " " + (OY + RY * Math.sin(a)).toFixed(1);
    }
    return d;
  };
  const drawOrb = () => {
    const a = orb.a;
    $("s04-otail1").setAttribute("d", arc(a - 0.45, a));
    $("s04-otail2").setAttribute("d", arc(a - 1.3, a - 0.2));
    const x = (OX + RX * Math.cos(a)).toFixed(1), y = (OY + RY * Math.sin(a)).toFixed(1);
    ["s04-ohead", "s04-ohalo"].forEach((id) => { $(id).setAttribute("cx", x); $(id).setAttribute("cy", y); });
  };
  drawOrb();
  gsap.set(["#s04-otail1", "#s04-otail2", "#s04-ohead", "#s04-ohalo"], { opacity: 0 });
  tl.to(["#s04-otail1", "#s04-otail2", "#s04-ohead", "#s04-ohalo"], { opacity: 1, duration: 0.1, ease: "none" }, T(14.15));
  tl.to(orb, { a: A0 + (DURATION - T(14.15)) * 3.96, duration: DURATION - T(14.15), ease: "none", onUpdate: drawOrb }, T(14.15));

  // Wireframe cube: real preserve-3d faces, set back in depth for parallax.
  gsap.set("#s04-cube", { z: -150, rotationX: -22, rotationY: 30 });
  tl.to("#s04-cube", { rotationX: 38, rotationY: 150, rotation: 12, duration: DURATION, ease: "none" }, 0);
  gsap.set("#s04-cube", { opacity: 0 });
  tl.to("#s04-cube", { opacity: 1, duration: 0.25, ease: "none" }, T(13.9));

  // Camera: tween the world through measured framings (scale s -> depth z = P(1 - 1/s)).
  const P = 1500, zOf = (s) => P * (1 - 1 / s);
  const CAM = [
    [11.40, 1.09, 95, -5], [11.80, 1.09, 128, -7], [12.00, 1.15, 350, 0], [12.15, 1.20, 350, 5], [12.25, 1.25, 302, 10],
    [12.30, 1.30, 281, 12], [12.40, 1.34, 225, 18], [12.50, 1.38, 161, 22], [12.60, 1.42, 109, 25], [12.70, 1.44, 46, 25],
    [12.90, 1.46, -3, 25], [13.00, 1.46, -64, 25], [13.10, 1.46, -136, 25], [13.15, 1.465, -75, 20], [13.30, 1.47, 7, 0],
    [13.40, 1.47, 109, -15], [13.50, 1.47, 211, -22], [13.60, 1.47, 317, -25], [13.70, 1.47, 252, -25], [13.80, 1.47, 191, -25],
    [13.90, 1.475, 119, -25], [14.00, 1.48, 62, -25], [14.10, 1.49, 1, -25], [14.20, 1.50, -30, -25], [14.30, 1.51, -100, -25],
    [14.40, 1.52, -180, -25], [14.50, 1.525, -250, -25], [14.60, 1.53, -310, -30], [14.70, 1.535, -101, -50], [14.75, 1.54, -32, -62],
    [14.85, 1.54, 75, -70], [14.95, 1.54, 202, -70], [15.00, 1.54, 260, -70], [15.05, 1.54, 319, -70], [15.20, 1.54, 221, -70],
    [15.30, 1.54, 137, -70], [15.45, 1.54, 105, -70],
  ];
  const world = $("s04-world");
  gsap.set(world, { x: CAM[0][2], y: CAM[0][3], z: zOf(CAM[0][1]) });
  // Ease into and out of the keys where the pan reverses so the camera settles there.
  const turn = (i) => i > 0 && i < CAM.length - 1 && (CAM[i][2] - CAM[i - 1][2]) * (CAM[i + 1][2] - CAM[i][2]) < 0;
  for (let k = 1; k < CAM.length; k++) {
    const [t0] = CAM[k - 1], [t1, s, x, y] = CAM[k];
    const ease = turn(k - 1) && turn(k) ? "sine.inOut" : turn(k - 1) ? "sine.in" : turn(k) ? "sine.out" : "none";
    tl.to(world, { x: x, y: y, z: zOf(s), duration: t1 - t0, ease: ease }, T(t0));
  }
  tl.to(world, { x: 0, y: 15, z: zOf(0.88), duration: 0.25, ease: "power2.inOut" }, T(15.45));
  tl.to(world, { x: 0, y: 0, z: 0, duration: 0.4, ease: "sine.out" }, T(15.70));
  // Push in to the enter key, hold, then fly through it.
  // The key lifts toward the lens with the push-in (key scale 3.8 against a panel at 2.45), then the
  // camera flies through it on measured depths.
  tl.to(world, { x: -571 * 0.3, y: -155 * 0.3, z: 888 * 0.3, duration: 0.22, ease: "power1.in" }, T(16.50));
  tl.to(world, { x: -571, y: -155, z: 888, duration: 0.08, ease: "power2.out" }, T(16.72));
  tl.to(["#s04-key", "#s04-keyart"], { z: 215, duration: 0.3, ease: "power1.inOut" }, T(16.50));
  const FLY = [[16.80, 888], [17.40, 916], [17.50, 938], [17.60, 975], [17.70, 1041], [17.80, 1134], [17.85, 1184], [17.9067, 1230]];
  for (let k = 1; k < FLY.length; k++) {
    tl.to(world, { z: FLY[k][1], duration: FLY[k][0] - FLY[k - 1][0], ease: k === 1 ? "sine.inOut" : "none" }, T(FLY[k - 1][0]));
  }

  // Radial speed lines and rings around the key, red tint behind.
  const rays = $("s04-rays");
  for (let i = 0; i < 120; i++) {
    const r = document.createElement("div");
    r.className = "s04-ray" + (i % 6 === 0 ? " s04-white" : "");
    const a = Math.random() * 360, c = Math.cos(a * Math.PI / 180), sn = Math.sin(a * Math.PI / 180);
    const len = 120 + Math.random() * 320;
    r.style.width = len.toFixed(0) + "px";
    r.style.height = (1 + Math.random() * 1.5).toFixed(1) + "px";
    rays.appendChild(r);
    gsap.set(r, { rotation: a, opacity: 0 });
    for (let t = T(16.55) + Math.random() * 0.4; t < T(17.93); t += 0.4) {
      const r0 = 90 + Math.random() * 200, r1 = 900 + Math.random() * 300;
      tl.set(r, { x: c * r0, y: sn * r0, opacity: 0.35 + Math.random() * 0.5 }, t);
      tl.to(r, { x: c * r1, y: sn * r1, duration: 0.4, ease: "power1.in" }, t);
    }
    tl.to(r, { opacity: 0, duration: 0.05, ease: "none" }, T(17.9));
  }
  [0, 1, 2].forEach((i) => {
    const t = T(16.93 + i * 0.22);
    tl.fromTo("#s04-ring" + i, { scale: 0.25, opacity: 0 }, { scale: 0.6, opacity: 0.9, duration: 0.1, ease: "power2.out" }, t);
    tl.to("#s04-ring" + i, { scale: 2.6, opacity: 0, duration: 0.6, ease: "power1.out" }, t + 0.1);
  });
  tl.to("#s04-tint", { opacity: 1, duration: 0.04, ease: "none" }, T(16.93));
  tl.to("#s04-tint", { opacity: 0.5, duration: 0.1, ease: "none" }, T(16.97));
  tl.to("#s04-tint", { opacity: 0, duration: 0.25, ease: "power1.out" }, T(17.07));
  tl.to("#s04-tint", { opacity: 0.7, duration: 0.15, ease: "power2.in" }, T(17.75));

  // Full red frame with a big blurred enter arrow just before the cut.
  tl.to("#s04-end", { opacity: 1, duration: 0.02, ease: "none" }, T(17.905));
  tl.fromTo("#s04-endart", { scale: 0.75 }, { scale: 1.15, duration: T(17.9667) - T(17.905), ease: "none" }, T(17.905));

  window.__timelines["s04"] = tl;
})();
</script>
