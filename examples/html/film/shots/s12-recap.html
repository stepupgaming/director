<script>
(() => {
  window.__timelines = window.__timelines || {};

  // Playback clock of the rewinding film inside the panel (seconds of the film).

  const clock = (s) => { const f = Math.round(s * 60); return pad(Math.floor(f / 60)) + ":" + pad(f % 60); };

  // ---------- recap screens, in film coordinates (1920x1080), shown in the panel ----------

  const capL = (words) => cap(words).replace('<p class="caption"', '<p class="caption" style="color:#141010"');
  const rays = (n, color, cx, cy, r0a, r0b, r1a, r1b, wa, wb, op) => {
    let s = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">`;
    for (let i = 0; i < n; i++) {
      const a = rnd(0, Math.PI * 2), r0 = rnd(r0a, r0b), r1 = r0 + rnd(r1a, r1b);
      s += `<line x1="${(cx + Math.cos(a) * r0).toFixed(1)}" y1="${(cy + Math.sin(a) * r0).toFixed(1)}" x2="${(cx + Math.cos(a) * r1).toFixed(1)}" y2="${(cy + Math.sin(a) * r1).toFixed(1)}" stroke="${color}" stroke-width="${rnd(wa, wb).toFixed(1)}" stroke-opacity="${rnd(op, 1).toFixed(2)}"/>`;
    }
    return s + "</svg>";
  };
  const curve = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;filter:drop-shadow(0 0 14px rgba(255,75,43,.7))"><path d="M 260 820 C 700 820, 820 240, 1660 250" fill="none" stroke="${RED}" stroke-width="14" stroke-linecap="round"/></svg>`;
  const grid = (() => {
    let s = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">`;
    for (let x = 0; x <= 1920; x += 120) s += `<line x1="${x}" y1="0" x2="${x}" y2="1080" stroke="#3a3638" stroke-width="1.5"/>`;

  const tunnel = (() => {
    let s = `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">`;
    for (let i = 0; i < 46; i++) {
      const a = rnd(0, Math.PI * 2);
      s += `<line x1="${(1000 + Math.cos(a) * 90).toFixed(1)}" y1="${(560 + Math.sin(a) * 70).toFixed(1)}" x2="${(1000 + Math.cos(a) * 1500).toFixed(1)}" y2="${(560 + Math.sin(a) * 1200).toFixed(1)}" stroke="#ff4b2b" stroke-opacity="${rnd(.25, .7).toFixed(2)}" stroke-width="${rnd(1, 2.5).toFixed(1)}"/>`;
    }

      const w = 170 + k * 60, h = 120 + k * 44;
      s += `<rect x="${1000 - w / 2}" y="${560 - h / 2}" width="${w}" height="${h}" rx="${22 + k * 6}" fill="none" stroke="#ff4b2b" stroke-opacity="${(0.9 - k * 0.15).toFixed(2)}" stroke-width="${k ? 2 : 4}"/>`;
    }
    s += `<circle cx="1000" cy="560" r="190" fill="none" stroke="#ff4b2b" stroke-opacity=".35" stroke-width="2"/>`;
    s += `<circle cx="1000" cy="560" r="900" fill="none" stroke="#ff4b2b" stroke-opacity=".18" stroke-width="2"/>`;
    // wire cube to the right
    const c = [[1430, 360], [1820, 380], [1800, 830], [1440, 800]], o = [70, 60];
    const q = (p) => p.map((v) => v.join(",")).join(" ");
    s += `<polygon points="${q(c)}" fill="none" stroke="#ff4b2b" stroke-opacity=".75" stroke-width="2.5"/>`;
    s += `<polygon points="${q(c.map(([x, y]) => [x + o[0], y + o[1]]))}" fill="none" stroke="#ff4b2b" stroke-opacity=".55" stroke-width="2"/>`;
    c.forEach(([x, y]) => { s += `<line x1="${x}" y1="${y}" x2="${x + o[0]}" y2="${y + o[1]}" stroke="#ff4b2b" stroke-opacity=".55" stroke-width="2"/>`; });
    return s + "</svg>";
  })();

  // The brief card from s04: it stretches as the rewind pulls it back, then
  // folds into the line it was drawn from.
  const brief = (() => {
    const ADV = 19.6, X = 352, Y = 452, L = 53;
    const lines = ["A 52-second film: heavy kinetic type, one glowing line", "through every scene, 30 letters the camera flies through, and", "a hard cut on every beat."];
    const chips = [[0, 24, 12], [0, 42, 12], [1, 21, 10], [1, 36, 20], [2, 2, 8]];
    let s = `<div id="s12-bdeco" style="position:absolute;left:0;top:0;width:1920px;height:1080px">
      <svg width="1920" height="1080" style="position:absolute;left:0;top:0">
        <polygon points="128,252 232,252 180,200 " fill="${RED}"/><polygon points="128,252 232,252 180,304" fill="${RED}"/>
        <path d="M92 773 H300 L312 785 V893 L300 905 H92 L80 893 V785 Z" fill="none" stroke="#bdb8b4" stroke-width="2"/>
        <path d="M122 793 H270 L280 803 V876 L270 886 H122 L112 876 V803 Z" fill="none" stroke="#bdb8b4" stroke-width="2"/>
        <ellipse cx="1735" cy="298" rx="125" ry="52" fill="none" stroke="#6c6866" stroke-width="1.5" stroke-dasharray="3 7"/>
        <path d="M1660 262 Q1700 246 1742 248" fill="none" stroke="#ff5a36" stroke-width="4" stroke-linecap="round"/>
        <polygon points="1701,621 1821,591 1851,711 1731,741" fill="none" stroke="#ff4b2b" stroke-width="2.5"/>
        <polygon points="1731,651 1851,621 1881,741 1761,771" fill="none" stroke="#ff4b2b" stroke-width="2" stroke-opacity=".6"/>
      </svg></div>
      <p id="s12-baa" style="position:absolute;left:-205px;top:440px;width:500px;margin:0;text-align:right;font-family:Archivo;font-size:166px;line-height:200px;color:#f4f1ee;letter-spacing:-3px;font-variation-settings:'wdth' 100, 'wght' 700">Aa</p>
      <div id="s12-bc" style="position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:960px 550px">
      <div style="position:absolute;left:322px;top:385px;width:1276px;height:330px;box-sizing:border-box;border:2px solid #8f8b88;border-radius:14px;background:#141417"></div>
      <div style="position:absolute;left:337px;top:404px;width:8px;height:8px;border-radius:50%;background:${RED}"></div>
      <p style="position:absolute;left:357px;top:399px;margin:0;font-family:'JetBrains Mono';font-size:14px;font-weight:600;letter-spacing:2px;color:#9a9693">BRIEF.md</p>`;
    for (const [l, c, n] of chips) s += `<div style="position:absolute;left:${X + c * ADV - 2}px;top:${Y + l * L + 1}px;width:${n * ADV + 4}px;height:51px;background:${RED}"></div>`;
    lines.forEach((t, l) => { s += `<p style="position:absolute;left:${X}px;top:${Y + l * L}px;margin:0;font-family:'JetBrains Mono';font-size:32.67px;font-weight:600;line-height:53px;color:#ece8e4;white-space:pre">${t}</p>`; });
    return s + "</div>" + cap("It got one brief.").replace('<p class="caption"', '<p class="caption" id="s12-bcap"');
  })();

  const SCREENS = [
    [0.000, RED, `<h1 ${D} style="top:330px;font-size:400px;color:#141010">FILM.</h1>`],
    [0.100, "#0e0d10", `<h1 ${D} style="top:360px;font-size:340px;color:#f4f1ee">CODE</h1>`],
    [0.167, "#0e0d10", curve],
    [0.200, "#0e0d10", `<h1 ${D} style="top:360px;font-size:340px;color:#f4f1ee">BRIEF.</h1>`],
    [0.267, PAPER, `<h1 ${D} style="top:220px;font-size:150px;color:#141010">RENDERED</h1>
      <h1 ${D} style="top:370px;font-size:160px;color:${RED}">ON A LAPTOP.</h1>
      <div style="position:absolute;left:30px;top:590px;width:600px;height:70px;background:linear-gradient(90deg,#141010,#7a7270 40%,#141010 70%,#d8d2cc);filter:blur(3px)"></div>
      <div style="position:absolute;left:180px;top:720px;width:1600px;height:3px;background:rgba(20,16,16,.15)"></div>
      <div style="position:absolute;left:180px;top:715px;width:40px;height:12px;border-radius:6px;background:${RED}"></div>
      <p class="s12-big s12-mono" style="top:790px;font-size:96px;letter-spacing:4px;color:#141010"><span id="s12-rcount">3108</span> / 3108</p>` + capL("Rendered on a laptop.")],
    [0.467, "#0e0d10", `<h1 ${D} style="top:300px;font-size:200px;color:#f4f1ee">3,108 FRAMES.</h1>
      <h1 ${D} style="top:540px;font-size:200px;color:${RED}">ALL CODE.</h1>`],
    [0.533, "#0e0d10", `<h1 ${D} style="top:250px;font-size:400px;color:${RED};filter:blur(9px);text-shadow:0 0 30px rgba(255,75,43,.6)" id="s12-lines">2,155</h1>
      <h1 ${D} style="top:640px;font-size:150px;color:#f4f1ee">LINES OF CODE</h1>` + cap("The whole film is one web page.")],
    [0.600, "#0e0d10", `<h1 ${D} style="top:380px;font-size:250px;color:#f4f1ee"><span style="color:${RED}">1</span> WEB PAGE</h1>`],
    [0.667, "#0e0d10", grid],
    [0.700, RED, rays(60, "#ffffff", 960, 540, 120, 260, 200, 900, 1.5, 4, .5) + `<h1 ${D} style="top:380px;font-size:300px;color:#141010">ELASTIC.</h1>`],
    [0.800, "#0e0d10", `<div class="s12-card" style="left:-40px;top:0;width:620px;height:820px;background:${RED}"></div>
      <h1 class="display" style="position:absolute;left:-180px;top:200px;margin:0;font-size:300px;color:#141010">TIC.</h1>
      <div class="s12-card" style="left:620px;top:70px;width:1120px;height:880px;background:#18161b;border:2px solid #2c2a31"></div>
      <div class="s12-bub" style="top:340px">hotter orange</div>
      <div class="s12-bub" style="top:500px">cut the intro in half</div>
      <div class="s12-card" style="left:700px;top:700px;width:720px;height:96px;background:#1f1d23;border:2px solid #3a3740"></div>
      <p style="position:absolute;left:740px;top:722px;margin:0;font-family:Inter;font-weight:700;font-size:40px;color:#bdb8b3">more punch</p>
      <div class="s12-card" style="left:1460px;top:690px;width:110px;height:110px;background:${RED}"></div>` + cap("Notes? Just type them.")],
    [0.967, RED, `<h1 ${D} style="top:380px;font-size:300px;color:#141010">ELASTIC.</h1>`],
    [1.033, SALMON, `<h1 class="display" style="position:absolute;left:60px;top:300px;margin:0;font-size:470px;color:rgba(80,70,70,.82);transform:rotate(-6deg)">BEAT.</h1>
      <h1 class="display" style="position:absolute;left:300px;top:320px;margin:0;font-size:300px;color:rgba(255,60,50,.75);transform:rotate(-3deg)">BEAT.</h1>` + cap("And a cut on every beat.", "#2a1814", true)],
    [1.100, "#0e0d10", `<h1 ${D} style="top:360px;font-size:340px;color:#f4f1ee">CUT</h1>`],
    [1.133, RED, `<h1 ${D} style="top:330px;font-size:420px;color:#141010">ON</h1>`],
    [1.167, "#0e0d10", `<h1 ${D} style="top:380px;font-size:280px;color:${RED}">THE TYPE</h1>`],
    [1.267, "#0e0d10", `<h1 ${D} style="top:250px;font-size:230px;color:#f4f1ee;filter:blur(8px)">THROUGH</h1>
      <h1 ${D} style="top:520px;font-size:230px;color:#f4f1ee;filter:blur(8px)">CAMERA</h1>`],
    [1.367, "#0e0d10", `<h1 ${D} style="top:400px;font-size:280px;color:#f4f1ee">CAMERA</h1>`],
    [1.400, RED, `<h1 ${D} style="top:380px;font-size:300px;color:#141010">ELASTIC.</h1>`],
    [1.567, "#1a0b09", tunnel + `<p style="position:absolute;left:965px;top:520px;margin:0;font-family:Inter;font-weight:700;font-size:64px;color:#ffd9cf">&#8629;</p>` + cap("It got one brief.")],
    [1.633, "#111214", brief],
    [1.933, "#2a0f0c", rays(70, "#ff4b2b", 960, 600, 40, 200, 300, 1100, 1, 2.5, .3) + `<h1 ${D} style="top:150px;font-size:130px;color:#f4f1ee">WRITTEN BY</h1>
      <h1 ${D} style="top:380px;font-size:300px;color:#f4f1ee;text-shadow:-10px 0 0 rgba(255,75,43,.6)">OPUS 5.5</h1>
      <div style="position:absolute;left:-60px;top:560px;width:2100px;height:5px;background:${RED};transform:rotate(-7deg);box-shadow:0 0 12px rgba(255,75,43,.8)"></div>
      <p class="s12-big s12-mono" style="top:860px;font-size:40px;color:#bdb8b3"><span style="color:${RED}">&gt;</span> in Claude Code</p>` + cap("Claude Opus 5.5 wrote it.")],
    [2.067, "#c9c5c0", `<h1 ${D} style="top:400px;font-size:230px;color:#2a2626">KEYFRAMES</h1>`],
    [2.133, "#0e0d10", `<svg width="1920" height="1080" style="position:absolute;left:0;top:0">
      <path d="M 200 900 L 1800 900 M 200 900 L 200 220" stroke="#8d8a88" stroke-width="3" fill="none"/>
      <path d="M 200 900 C 400 890, 300 260, 260 230" stroke="#b9b4b0" stroke-width="4" fill="none"/>
      ${[200, 420, 640, 860, 1080, 1300, 1520, 1740].map((x) => `<circle cx="${x}" cy="900" r="7" fill="#b9b4b0"/>`).join("")}
      <circle cx="560" cy="900" r="11" fill="${RED}"/></svg>`],
    [2.200, "#0e0d10", `<h1 ${D} style="top:380px;font-size:220px;color:#f4f1ee"><span style="color:${RED}">NO</span> RENDER FARM</h1>`],
    [2.267, PAPER, `<h1 ${D} style="top:400px;font-size:200px;color:#141010"><span style="color:${RED}">NO</span> PLUGINS</h1>`],
    [2.333, "#0e0d10", `<h1 ${D} style="top:380px;font-size:240px;color:#f4f1ee"><span style="color:${RED}">NO</span> TIMELINE</h1>`],
    [2.400, RED, `<h1 ${D} style="top:220px;font-size:260px;color:#141010">IS</h1><h1 ${D} style="top:480px;font-size:320px;color:#141010">CODE.</h1>`],
    [2.467, "#8f8a86", `<h1 ${D} style="top:330px;font-size:420px;color:#f4f1ee">IS</h1>`],
    [2.483, PAPER, `<h1 ${D} style="top:240px;font-size:220px;color:#141010">OF THIS</h1><h1 ${D} style="top:480px;font-size:340px;color:#141010">FILM</h1>`],
    [2.500, SALMON, `<h1 ${D} style="top:360px;font-size:330px;color:#141010">FRAME</h1>`],
    [2.517, "#2e0f0b", rays(110, "#ffffff", 960, 540, 60, 300, 250, 900, 1.5, 3.5, .45) +
      `<svg width="1920" height="1080" style="position:absolute;left:0;top:0;filter:drop-shadow(0 0 10px rgba(255,75,43,.8))"><circle cx="960" cy="540" r="560" fill="none" stroke="${RED}" stroke-width="9"/></svg>
      <h1 ${D} style="top:350px;font-size:350px;color:#fff3ee;text-shadow:8px 8px 0 rgba(255,75,43,.55)">EVERY</h1>` + cap("Every")],
  ];
  const host = $("s12-screens");
  SCREENS.forEach(([t0, bg, html], i) => {
    const d = document.createElement("div");
    d.className = "s12-scr";
    d.id = "s12-scr" + i;
    d.style.background = bg;
    d.innerHTML = `<div class="s12-in" id="s12-in${i}">${html}</div>`;
    host.appendChild(d);
    const t1 = i + 1 < SCREENS.length ? SCREENS[i + 1][0] : DURATION;
    // Cuts land between frames so the shutter never blends two screens.
    const cut = (t) => (Math.round(t * 60) - 0.5) / 60;
    tl.set(d, { opacity: 1 }, i ? cut(t0) : 0);
    if (t1 < DURATION) tl.set(d, { opacity: 0 }, cut(t1));
    // Each screen plays backwards: its push-in unwinds while it is on.
    tl.fromTo("#s12-in" + i, { scale: 1.0 }, { scale: 1.06, duration: Math.max(t1 - t0, 0.02), ease: "none", immediateRender: false }, t0);
  });
  // The brief card unwinds: it stretches wide, Aa slides back into it, the
  // card folds into a line and the caption un-types.
  tl.to("#s12-bc", { scaleX: 1.55, x: 140, duration: 0.09, ease: "power2.in" }, 1.69);
  tl.to("#s12-baa", { x: 520, opacity: 0, duration: 0.09, ease: "power2.in" }, 1.69);
  tl.to("#s12-bdeco", { opacity: 0, duration: 0.06 }, 1.72);
  tl.to("#s12-bc", { scaleX: 0.72, scaleY: 0.008, x: 0, duration: 0.1, ease: "power3.in" }, 1.8);
  const bw = document.querySelectorAll("#s12-bcap .w");
  [1.86, 1.88, 1.9].forEach((t, k) => {
    const i = bw.length - 1 - k;
    tl.set(bw[i], { opacity: 0 }, t);
    tl.set(bw[i - 1], { backgroundColor: RED, color: "#1a0c0a", paddingLeft: 6, paddingRight: 6, borderRadius: 4 }, t);
  });

  // ---------- clocks: film HUD, panel HUD, rewind rate, progress ----------
  tl.to({}, { duration: DURATION, ease: "none", onUpdate() {
    const t = tl.time();
    const f = Math.round((FILM_START + t) * 60);
    $("s12-frame").textContent = pad(f, 4);
    $("s12-tc").textContent = "00:00:" + pad(Math.floor(f / 60)) + ":" + pad(f % 60);
    const p = play(t), pf = Math.round(p * 60);
    $("s12-mframe").textContent = pad(pf, 4);
    $("s12-mtc").textContent = "00:00:" + clock(p);
    $("s12-clock").textContent = "00:" + clock(p) + "  /  00:51:47";
    $("s12-rate").textContent = "◀◀ " + Math.round(17 + 5 * t / DURATION) + "×";
    const rc = $("s12-rcount"); if (rc) rc.textContent = pad(Math.max(0, Math.round(3108 * (1 - (t - 0.267) / 0.2))), 4);
    const ln = $("s12-lines");
    if (ln) { const n = Math.round(2155 - Math.max(0, t - 0.533) / 0.067 * 300); ln.textContent = Math.floor(n / 1000) + "," + pad(n % 1000, 3); }
  } }, 0);
  tl.fromTo("#s12-fill", { scaleX: play(0) / FILM_LEN }, { scaleX: play(DURATION) / FILM_LEN, duration: DURATION, ease: "none" }, 0);

  // ---------- the panel: swings in from above, turns from right-near to left-near, then fills the frame ----------
  gsap.set("#s12-rig", { transformOrigin: "50% 50%" });
  tl.fromTo("#s12-rig", { x: 120, y: -760, rotationX: -62, rotationY: -26, rotationZ: 8, scale: 0.9 },
    { x: 66, y: 30, rotationX: 10, rotationY: -15, rotationZ: 1.2, scale: 0.96, duration: 0.09, ease: "power3.out" }, 0);
  tl.to("#s12-rig", { x: -46, y: 24, rotationX: 4, rotationY: 8, rotationZ: -1, scale: 1.04, duration: 2.62, ease: "sine.inOut" }, 0.09);
  tl.to("#s12-rig", { x: -40, y: 10, rotationX: 0, rotationY: 0, rotationZ: 0, scale: 1.5, duration: 0.05, ease: "power2.out" }, 2.717);
  tl.to(["#s12-label", "#s12-rate", "#s12-bar", "#s12-clock"], { opacity: 0, duration: 0.03 }, 2.72);

  // ---------- caption with the moving chip ----------
  const words = $$("#s12-cap .w");
  const cw = [0.017, 0.533, 0.733, 0.933];
  cw.forEach((t, i) => {
    const r = words[i].getBoundingClientRect();
    tl.fromTo(words[i], { opacity: 0, x: 14, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.07, ease: "power2.out" }, t - 0.017);
    tl.to("#s12-chip", { left: r.left - 6, top: r.top - 2, width: r.width + 12, height: r.height + 4, duration: i ? 0.06 : 0.01, ease: "power3.out" }, t + 0.017);
    tl.set(words[i], { color: "#1a0c0a" }, t + 0.03);
    if (i) tl.set(words[i - 1], { color: "#f4f1ee" }, t + 0.03);
  });
  tl.set("#s12-chip", { opacity: 1 }, 0.04);
  tl.to(["#s12-cap", "#s12-chip"], { opacity: 0, duration: 0.02 }, 2.712);

  window.__timelines["s12"] = tl;
})();
</script>
