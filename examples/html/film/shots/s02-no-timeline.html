<script>

  window.__timelines = window.__timelines || {};
  const FILM_START = 187 / 60, DURATION = 331 / 60;
  const tl = gsap.timeline({ paused: true });
  const pad = (n, w = 2) => String(n).padStart(w, "0");
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const rnd = (a, b) => a + Math.random() * (b - a);
  // every time below is film time; T() maps it to the shot clock
  const T = (ft) => ft - FILM_START;
  // discrete changes land between frames so no shutter sample straddles them
  const H = (ft) => (Math.round(ft * 60) - 0.5) / 60 - FILM_START;
  const el = (tag, cls, parent, html) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    parent.appendChild(e);
    return e;
  };

  tl.to({}, { duration: DURATION, ease: "none", onUpdate() {
    const f = Math.round((FILM_START + tl.time()) * 60);
    document.getElementById("s02-frame").textContent = pad(f, 4);
    document.getElementById("s02-tc").textContent = "00:00:" + pad(Math.floor(f / 60)) + ":" + pad(f % 60);
  } }, 0);

  // spark burst: n short streaks flying out of (cx, cy)
  function burst(parent, cx, cy, n, t0, dist, len, cls) {
    for (let i = 0; i < n; i++) {
      const h = el("div", "s02-ray", parent);
      h.style.left = cx + "px"; h.style.top = cy + "px";
      h.style.transform = "rotate(" + rnd(0, 360).toFixed(1) + "deg)";
      const s = el("div", "s02-streak " + cls, h);
      s.style.opacity = "0";
      s.style.width = rnd(len[0], len[1]).toFixed(0) + "px";
      const d = rnd(0.12, 0.22), t = t0 + rnd(0, 0.03);
      tl.fromTo(s, { x: rnd(0, 10), opacity: 0 }, { x: rnd(dist[0], dist[1]), duration: d, ease: "power2.out", immediateRender: false }, T(t));
      tl.to(s, { opacity: 1, duration: 0.02 }, T(t));
      tl.to(s, { opacity: 0, duration: d * 0.5, ease: "power1.in" }, T(t + d * 0.5));
    }
  }

    el("div", "s02-hr", p).style.top = "38px";

  tl.set("#s02-gr", { opacity: 0 }, H(7.95));

  // ======================= 0 KEYFRAMES  7.95 - 8.62 =======================
  const z3d = $("#s02-z3d"), zf = $("#s02-zf");
  for (let k = 40; k >= 1; k--) {
    const h = document.createElement("h1");
    h.className = "display s02-zero";
    h.textContent = "0";
    const g = Math.round(9 + 16 * (k / 40));
    h.style.color = "rgb(" + g + "," + g + "," + (g + 7) + ")";
    h.style.transform = "translateZ(" + (-16 * k) + "px)";
    z3d.insertBefore(h, zf);
  }
  const kr = $("#s02-krays");
  for (let i = 0; i < 110; i++) {
    const h = el("div", "s02-ray", kr);
    h.style.left = "960px"; h.style.top = "540px";
    h.style.transform = "rotate(" + rnd(0, 360).toFixed(1) + "deg)";
    const s = el("div", "s02-streak s02-gray", h);
    s.style.width = rnd(160, 520).toFixed(0) + "px";
    s.style.height = rnd(1.5, 3.5).toFixed(1) + "px";
    const r0 = rnd(220, 820);
    tl.fromTo(s, { x: r0, opacity: 0 }, { x: r0 + rnd(500, 900), duration: rnd(0.35, 0.5), ease: "power1.in", immediateRender: false }, T(7.95));
    tl.to(s, { opacity: rnd(0.5, 1), duration: 0.02 }, T(7.95));
    tl.to(s, { opacity: 0, duration: 0.1 }, T(rnd(8.28, 8.4)));
  }
  const rips = $("#s02-rips");
  for (let k = 0; k < 4; k++) {
    const h = el("div", "s02-rip", rips);
    const c = el("div", "s02-ripc", h);
    const t = 7.97 + k * 0.1;
    tl.fromTo(c, { scale: 0.85, opacity: 0 }, { scale: 2.4, duration: 0.55, ease: "power1.out", immediateRender: false }, T(t));
    tl.to(c, { opacity: 1, duration: 0.05 }, T(t));
    tl.to(c, { opacity: 0, duration: 0.25 }, T(t + 0.3));
  }
  tl.set("#s02-kc", { opacity: 1 }, H(7.95));
  tl.fromTo("#s02-z3d", { scale: 3.1, filter: "blur(0px)" }, { scale: 1, duration: 0.17, ease: "power3.out", immediateRender: false }, T(7.945));
  tl.fromTo("#s02-kw", { x: 700, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.09, ease: "power3.out", immediateRender: false }, T(7.99));
  tl.fromTo("#s02-kd", { x: 60, opacity: 0, filter: "blur(4px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.08, ease: "power2.out", immediateRender: false }, T(8.07));
  tl.set(["#s02-kw", "#s02-kd"], { opacity: 0 }, 0);
  tl.to("#s02-z3d", { scale: 1.035, duration: 0.33, ease: "none" }, T(8.12));
  // exit: the zero rushes the lens, the words whip right, then black
  tl.to("#s02-z3d", { scale: 3.4, duration: 0.15, ease: "power2.in" }, T(8.45));
  tl.to("#s02-kt", { x: 1100, duration: 0.13, ease: "power2.in" }, T(8.45));
  tl.to("#s02-dark", { opacity: 1, duration: 0.06, ease: "power1.in" }, T(8.535));

  // ======================= captions =======================
  const w1 = $$("#s02-cap1 .w"), w2 = $$("#s02-cap2 .w");
  const cw1 = [3.46, 3.595, 4.495, 4.63, 5.71, 5.845, 5.98];
  const cw2 = [6.64, 6.845, 7.045, 7.395, 7.68, 7.845];
  const light = (t) => (t >= 4.15 && t < 5.1833) || t >= 7.95;
  const words = (ws, cws) => cws.forEach((t, i) => {
    const r = ws[i].getBoundingClientRect();
    tl.fromTo(ws[i], { opacity: 0, x: 14, filter: "blur(6px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.07, ease: "power2.out", immediateRender: false }, T(t - 0.03));
    tl.to("#s02-chip", { left: r.left - 6, top: r.top - 2, width: r.width + 12, height: r.height + 4, duration: i ? 0.07 : 0.01, ease: "power3.out" }, T(t - 0.02));
    tl.set(ws[i], { color: light(t) ? "#f04a2c" : "#1a0c0a" }, H(t - 0.03));
    if (i) tl.set(ws[i - 1], { color: light(t) ? "#141010" : "#f4f1ee" }, H(t - 0.02));
  });
  tl.set([...w1, ...w2], { opacity: 0 }, 0);
  words(w1, cw1);
  words(w2, cw2);
  tl.set("#s02-chip", { opacity: 1 }, H(3.44));
  tl.to(["#s02-cap1", "#s02-chip"], { opacity: 0, duration: 0.04 }, T(6.55));
  tl.set("#s02-chip", { opacity: 1 }, H(6.62));
  const flip = (t, dark) => {
    tl.set("#s02-chip", { backgroundColor: dark ? "#ef4a2c" : "#2a1814" }, H(t));
    [[w1, cw1], [w2, cw2]].forEach(([ws, cws]) => {
      const last = cws.filter((c) => c <= t + 0.031).length - 1;
      ws.forEach((w, i) => {
        if (i < last) tl.set(w, { color: dark ? "#f4f1ee" : "#141010" }, H(t));
        if (i === last) tl.set(w, { color: dark ? "#1a0c0a" : "#f04a2c" }, H(t));
      });
    });
    $$("#s02 .hud").forEach((h) => tl.set(h, { color: dark ? "#8d8a88" : "#6d6560" }, H(t)));
    $$("#s02 .corner").forEach((c) => tl.set(c, { borderColor: dark ? "rgba(255,255,255,.35)" : "rgba(0,0,0,.35)" }, H(t)));
  };
  flip(4.15, false);
  flip(5.1833, true);
  flip(7.95, false);
  tl.to("#s02-chip", { opacity: 0, duration: 0.03 }, T(8.535));
  tl.to(w2.slice(0, 5), { opacity: 0, duration: 0.03 }, T(8.535));
  tl.to(w2[5], { opacity: 0, duration: 0.03 }, T(8.575));
  flip(8.567, true);

  window.__timelines["s02"] = tl;
})();
</script>
