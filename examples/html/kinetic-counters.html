<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Bold.ttf"); font-weight:700; }
  html, body { margin:0; background:#000; }
  * { box-sizing:border-box; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:#0b0b0f; font-family:Roboto; font-weight:700; color:#fff; }
  .label { position:absolute; left:0; width:1920px; margin:0; text-align:center; font-size:44px; letter-spacing:12px; color:#8a8a99; }
  .count { position:absolute; left:0; width:1920px; margin:0; text-align:center; line-height:1.2; font-variant-numeric:tabular-nums;
           mask-image:linear-gradient(transparent, #000 14%, #000 86%, transparent); }
  #revenue { top:250px; font-size:220px; }
  #growth { top:690px; font-size:150px; color:#ff3d6e; }
</style></head><body>
<!-- Each digit rolls through a clipped window and lands left to right; motion blur smears the fast spins. -->
<div id="stage" data-composition-id="kinetic-counters" data-width="1920" data-height="1080" data-fps="30"
     data-duration="4" data-motion-blur="6">
  <p class="label" style="top:180px">REVENUE</p>
  <h1 class="count" id="revenue" data-reel data-reel-start="0.3" data-reel-duration="1.6"
      data-reel-stagger="0.12" data-reel-spins="2">$2,048,000</h1>
  <p class="label" style="top:620px">GROWTH</p>
  <h2 class="count" id="growth" data-start="1" data-reel data-reel-from="000" data-reel-direction="down"
      data-reel-duration="1.2" data-reel-stagger="0.15" data-reel-ease="expo.out">+312%</h2>
</div>
</body></html>
