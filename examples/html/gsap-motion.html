<!doctype html>
<html><head><meta charset="utf-8"><style>
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Regular.ttf"); font-weight:400; }
  @font-face { font-family:Roboto; src:url("../../crates/director-core/assets/fonts/Roboto-Bold.ttf"); font-weight:700; }
  html, body { margin:0; background:#111827; }
  * { box-sizing:border-box; }
  #stage { position:relative; width:100%; height:100%; overflow:hidden; background:linear-gradient(160deg,#111827 0%,#1f2a44 100%); font-family:Roboto; color:#fff; }
  #title { position:absolute; left:140px; top:280px; margin:0; font-size:112px; font-weight:700; }
  #subtitle { position:absolute; left:144px; top:430px; margin:0; font-size:40px; color:#c7d2fe; }
  #rule { position:absolute; left:144px; top:520px; width:0px; height:10px; border-radius:5px; background:#f472b6; }
  .tile { position:absolute; top:640px; width:300px; height:200px; border-radius:24px; background:#312e81; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; }
  .tile.a { left:144px; }
  .tile.b { left:484px; }
  .tile.c { left:824px; }
  #pulse { position:absolute; left:1500px; top:300px; width:160px; height:160px; border-radius:80px; background:#f472b6; }
</style></head><body>
<div id="stage" data-composition-id="gsap-motion" data-width="1920" data-height="1080" data-fps="30" data-duration="5">
  <h1 id="title">GSAP, natively.</h1>
  <p id="subtitle">Timelines compile to director-timeline/1 keyframe tracks.</p>
  <div id="rule"></div>
  <div class="tile a">labels</div>
  <div class="tile b">stagger</div>
  <div class="tile c">eases</div>
  <div id="pulse"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true, defaults: { duration: 0.8, ease: "power3.out" } });
  tl.from("#title", { x: -160, opacity: 0 }, 0)
    .from("#subtitle", { y: 30, opacity: 0 }, 0.4)
    .fromTo("#rule", { width: 0 }, { width: 920, duration: 1, ease: "expo.inOut" }, "<0.3")
    .addLabel("tiles", "-=0.4")
    .from(".tile", { y: 120, rotation: -6, opacity: 0, stagger: 0.12, ease: "back.out(1.7)" }, "tiles")
    .to(".tile", { backgroundColor: "#4f46e5", duration: 0.6, stagger: 0.12, ease: "sine.inOut" }, ">0.2")
    .fromTo("#pulse", { scale: 0.6 }, { scale: 1, duration: 0.5, ease: "sine.inOut", repeat: 7, yoyo: true }, 1);
  window.__timelines["gsap-motion"] = tl;
</script>
</body></html>
