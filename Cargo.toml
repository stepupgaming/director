[workspace]
resolver = "2"
members = [
    "crates/director-core",
    "crates/director-html",
    "crates/director-dom",
    "crates/director-recorder",
    "crates/director-cli",
    "crates/director-schema",
    "crates/director-scene",
    "crates/director-render",
    "crates/director-host",
    "crates/director-3d",
    "crates/director-track",
    "crates/director-breakdown",
    "crates/lottie-core",
    "crates/lottie-data",
    "crates/lottie-skia",
]
exclude = ["vendor/skia-safe", "vendor/bevy_pbr"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stepupgaming/director"
homepage = "https://github.com/stepupgaming/director"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0.17"
anyhow = "1.0"
glam = "0.24"
kurbo = "0.9"
# One Skia feature set for every crate and command. The GPU backend is always
# compiled, so builds, tests and `-p` runs share one skia-bindings build and
# one artifact hash per crate.
# `director-skia-safe` is `vendor/skia-safe` published under its own name, so
# builds from crates.io keep the Vulkan resolver patch. Code imports `skia_safe`.
skia-safe = { package = "director-skia-safe", path = "vendor/skia-safe", version = "0.153.3", features = ["textlayout", "ganesh", "vulkan"] }
schemars = "0.8"
ron = "0.8"

# Internal. Every crate publishes at the workspace version. The core crate
# publishes as `director-video-core` because crates.io already holds
# `director_core`; its library name stays `director_core`.
lottie-core = { package = "director-lottie-core", path = "crates/lottie-core", version = "0.1.0" }
lottie-data = { package = "director-lottie-data", path = "crates/lottie-data", version = "0.1.0" }
lottie-skia = { package = "director-lottie-skia", path = "crates/lottie-skia", version = "0.1.0" }
director-core = { package = "director-video-core", path = "crates/director-core", version = "0.1.0" }
director-scene = { path = "crates/director-scene", version = "0.1.0" }
director-dom = { path = "crates/director-dom", version = "0.1.0" }
director-recorder = { path = "crates/director-recorder", version = "0.1.0" }
director-track = { path = "crates/director-track", version = "0.1.0" }
director-render = { path = "crates/director-render", version = "0.1.0" }
director-schema = { path = "crates/director-schema", version = "0.1.0" }
director-3d = { path = "crates/director-3d", version = "0.1.0" }
director-html = { path = "crates/director-html", version = "0.1.0" }
director-host = { path = "crates/director-host", version = "0.1.0" }
director-breakdown = { path = "crates/director-breakdown", version = "0.1.0" }

# Repo builds only: the fog composite's alpha blend in `vendor/bevy_pbr`.
# Published builds take upstream bevy_pbr; see vendor/AGENTS.md.
[patch.crates-io]
bevy_pbr = { path = "vendor/bevy_pbr" }

