[workspace]
resolver = "2"
members = [
    "crates/director-core",
    "crates/director-html",
    "crates/director-cli",
    "crates/director-schema",
    "crates/director-scene",
    "crates/director-render",
    "crates/director-host",
    "crates/lottie-core",
    "crates/lottie-data",
    "crates/lottie-skia",
]
exclude = ["vendor/skia-safe"]


[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0.17"
anyhow = "1.0"
glam = "0.24"
kurbo = "0.9"
# One Skia feature set for every crate and command. The GPU backend is always
# compiled, so builds, tests and `-p` runs share one skia-bindings build and
# one artifact hash per crate.
skia-safe = { version = "0.153.3", features = ["textlayout", "ganesh", "vulkan"] }
schemars = "0.8"
ron = "0.8"

# Internal
lottie-core = { path = "crates/lottie-core", version = "0.1.0" }
lottie-data = { path = "crates/lottie-data", version = "0.1.0" }
lottie-skia = { path = "crates/lottie-skia", version = "0.1.0" }
director-core = { path = "crates/director-core", version = "1.1.1" }
director-scene = { path = "crates/director-scene", version = "0.1.0" }

[patch.crates-io]
skia-safe = { path = "vendor/skia-safe" }

