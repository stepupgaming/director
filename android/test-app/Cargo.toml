[package]
name = "dirapk"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
name = "main"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
director-html = { path = "../../crates/director-html", default-features = false }
director_core = { package = "director-video-core", path = "../../crates/director-core", default-features = false }
director-render = { path = "../../crates/director-render", default-features = false }
director-scene = { path = "../../crates/director-scene" }
crossbeam-channel = "0.5"
anyhow = "1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6.1", features = ["native-activity"] }

[profile.release]
debug = false

[patch.crates-io]
bevy_pbr = { path = "../../vendor/bevy_pbr" }
