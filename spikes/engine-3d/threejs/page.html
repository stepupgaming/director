<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>three spike</title>
<style>html, body { margin: 0; background: #000; }</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
// Three.js engine spike for issue 9. Renders spike.glb under IBL from
// forest.hdr with shadows, bloom and AgX, then times the render and the
// full-frame readback a separate browser process pays to hand frames over.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { HDRLoader } from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const q = new URLSearchParams(location.search);
const width = +q.get('w'), height = +q.get('h'), frames = +q.get('frames');

window.spike = (async () => {
  const canvas = document.createElement('canvas');
  document.body.appendChild(canvas);
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(width, height, false);
  renderer.toneMapping = THREE.AgXToneMapping;
  // EV100 11, matching the native spikes: exposure = 1 / (1.2 * 2^11). The
  // scene is pre-exposed (lights and IBL scaled by it) so half-float buffers
  // stay below 65504; tone mapping then runs at exposure 1.
  const exposure = 1 / (1.2 * 2048);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  const gl = renderer.getContext();
  const dbg = gl.getExtension('WEBGL_debug_renderer_info');
  const gpu = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER);

  const t0 = performance.now();
  const [gltf, hdr] = await Promise.all([
    new GLTFLoader().loadAsync('/assets/spike.glb'),
    new HDRLoader().loadAsync('/assets/forest.hdr'),
  ]);
  // Background and environment apply only to a THREE.Scene, so wrap the glTF root.
  const scene = new THREE.Scene();
  scene.add(gltf.scene);
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.background = hdr;
  scene.environmentIntensity = 3000 * exposure;
  scene.backgroundIntensity = 3000 * exposure;
  scene.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
    if (o.isLight) o.intensity *= exposure;
    if (o.isLight && o.shadow) {
      o.castShadow = true;
      o.shadow.mapSize.set(2048, 2048);
      o.shadow.bias = -0.0005;
      if (o.isDirectionalLight) Object.assign(o.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 });
    }
  });
  const camera = gltf.cameras[0];
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  const mixer = new THREE.AnimationMixer(gltf.scene);
  mixer.clipAction(gltf.animations[0]).play();

  const target = new THREE.WebGLRenderTarget(width, height, { type: THREE.HalfFloatType, samples: +(q.get('msaa') ?? 4) });
  const composer = new EffectComposer(renderer, target);
  composer.setPixelRatio(1);
  composer.setSize(width, height);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(width, height), 0.25, 0.4, 0.9));
  composer.addPass(new OutputPass());

  const one = new Uint8Array(4);
  const pixels = new Uint8Array(width * height * 4);
  const sync = () => gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, one);
  const plain = q.get('plain') === '1';
  const draw = (t) => { mixer.setTime(t); if (plain) renderer.render(scene, camera); else composer.render(); };
  for (let i = 0; i < 5; i++) { draw(i / 30); sync(); }
  const bootMs = performance.now() - t0;

  const t3d = [], tread = [];
  const warmup = 10;
  for (let i = 0; i < frames + warmup; i++) {
    const t = (i % 120) / 30;
    const a = performance.now();
    draw(t);
    sync();
    const b = performance.now();
    gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    const c = performance.now();
    if (i >= warmup) { t3d.push(b - a); tread.push(c - b); }
  }
  draw(70 / 30); sync();
  return { gpu, bootMs, t3d, tread };
})();
</script>
</body>
</html>
